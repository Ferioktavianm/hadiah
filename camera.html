<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CCTV Camera</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            background: #0d1117;
            color: white;

            font-family: Arial, sans-serif;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;

            margin: auto;
        }

        .card {
            background: #161b22;

            border: 1px solid #30363d;

            border-radius: 18px;

            padding: 24px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #8b949e;

            margin-bottom: 20px;
        }

        video {
            width: 100%;

            aspect-ratio: 16 / 9;

            object-fit: cover;

            display: block;

            background: black;

            border-radius: 14px;

            margin-top: 20px;
        }

        .info {
            margin-top: 16px;

            padding: 15px;

            background: #0d1117;

            border-radius: 10px;

            color: #8b949e;

            line-height: 1.8;
        }

        .online {
            color: #3fb950;
        }

        .warning {
            color: #d29922;
        }

        .error {
            color: #f85149;
        }

        button {
            width: 100%;

            margin-top: 16px;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #da3633;

            color: white;

            font-size: 16px;

            font-weight: bold;
        }

        button:active {
            transform: scale(.98);
        }

        .log {
            margin-top: 16px;

            padding: 12px;

            background: #010409;

            border-radius: 10px;

            color: #8b949e;

            font-family: monospace;

            font-size: 12px;

            white-space: pre-wrap;

            max-height: 180px;

            overflow-y: auto;
        }

    </style>
</head>


<body>

<div class="container">

    <div class="card">

        <h1>
            📷 CCTV CAMERA
        </h1>

        <p class="subtitle">
            Perangkat ini digunakan sebagai kamera.
        </p>


        <video
            id="camera"
            autoplay
            muted
            playsinline
        ></video>


        <div class="info">

            Camera ID:
            <strong>
                CAMERA-01
            </strong>

            <br>

            Monitor:
            <strong>
                MONITOR-01
            </strong>

            <br>

            Status:
            <strong
                id="status"
                class="warning"
            >
                STARTING...
            </strong>

        </div>


  <!--        <button
            onclick="stopCamera()"
        >
            STOP CAMERA
        </button>
        -->


        <div
            id="log"
            class="log"
        ></div>

    </div>

</div>


<!-- PeerJS -->

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>


<script>

    /*
     * =====================================================
     * CONFIG
     * =====================================================
     */

    const CAMERA_ID = "CAMERA-01";

    const MONITOR_ID = "MONITOR-01";


    /*
     * =====================================================
     * VARIABLES
     * =====================================================
     */

    let peer = null;

    let cameraStream = null;

    let currentCall = null;

    let retryTimer = null;


    /*
     * =====================================================
     * ELEMENT
     * =====================================================
     */

    const video =
        document.getElementById("camera");

    const status =
        document.getElementById("status");

    const logElement =
        document.getElementById("log");


    /*
     * =====================================================
     * LOG
     * =====================================================
     */

    function log(message) {

        console.log(
            "[CAMERA]",
            message
        );


        const time =
            new Date()
                .toLocaleTimeString();


        logElement.textContent +=
            `[${time}] ${message}\n`;


        logElement.scrollTop =
            logElement.scrollHeight;
    }


    /*
     * =====================================================
     * STATUS
     * =====================================================
     */

    function setStatus(
        text,
        type
    ) {

        status.textContent =
            text;


        status.className =
            type;
    }


    /*
     * =====================================================
     * START
     * =====================================================
     */

    window.addEventListener(
        "load",
        startCamera
    );


    /*
     * =====================================================
     * CAMERA
     * =====================================================
     */

    async function startCamera() {

        log(
            "Memulai kamera..."
        );


        try {

            if (
                !navigator.mediaDevices ||
                !navigator.mediaDevices.getUserMedia
            ) {

                throw new Error(
                    "getUserMedia tidak tersedia. Gunakan HTTPS atau localhost."
                );
            }


            setStatus(
                "REQUESTING CAMERA",
                "warning"
            );


            log(
                "Meminta permission kamera..."
            );


            cameraStream =
                await navigator.mediaDevices
                    .getUserMedia({

                        video: {
                            facingMode: "environment",

                            width: {
                                ideal: 1280
                            },

                            height: {
                                ideal: 720
                            },

                            frameRate: {
                                ideal: 20,
                                max: 30
                            }
                        },

                        audio: false
                    });


            log(
                "Permission kamera berhasil."
            );


            video.srcObject =
                cameraStream;


            await video.play();


            setStatus(
                "CAMERA READY",
                "online"
            );


            log(
                "Video kamera aktif."
            );


            createPeer();

        } catch (error) {

            console.error(
                error
            );


            log(
                "CAMERA ERROR: " +
                error.name +
                " - " +
                error.message
            );


            setStatus(
                error.name,
                "error"
            );
        }
    }


    /*
     * =====================================================
     * PEER
     * =====================================================
     */

    function createPeer() {

        log(
            "Membuat Peer: " +
            CAMERA_ID
        );


        /*
         * ID kamera dibuat tetap.
         */

        peer =
            new Peer(
                CAMERA_ID
            );


        /*
         * Peer berhasil terhubung
         * ke PeerJS signaling server.
         */

        peer.on(
            "open",
            function(id) {

                log(
                    "Peer berhasil online: " +
                    id
                );


                setStatus(
                    "ONLINE - WAITING MONITOR",
                    "online"
                );


                /*
                 * Coba hubungi monitor.
                 */

                connectToMonitor();
            }
        );


        /*
         * Ada monitor masuk.
         *
         * Ini juga kita tangani supaya
         * kamera fleksibel.
         */

        peer.on(
            "call",
            function(call) {

                log(
                    "Incoming call dari: " +
                    call.peer
                );


                /*
                 * Kita hanya menerima
                 * monitor yang benar.
                 */

                if (
                    call.peer !== MONITOR_ID
                ) {

                    log(
                        "Call ditolak karena ID monitor salah."
                    );

                    call.close();

                    return;
                }


                /*
                 * Kamera mengirim stream.
                 */

                call.answer(
                    cameraStream
                );


                currentCall =
                    call;


                setStatus(
                    "LIVE",
                    "online"
                );


                log(
                    "Video dikirim ke monitor."
                );


                call.on(
                    "close",
                    function() {

                        log(
                            "Monitor disconnect."
                        );


                        currentCall =
                            null;


                        setStatus(
                            "ONLINE - WAITING MONITOR",
                            "online"
                        );


                        scheduleRetry();
                    }
                );


                call.on(
                    "error",
                    function(error) {

                        log(
                            "CALL ERROR: " +
                            error.message
                        );


                        currentCall =
                            null;


                        setStatus(
                            "CALL ERROR",
                            "error"
                        );


                        scheduleRetry();
                    }
                );
            }
        );


        /*
         * Peer error
         */

        peer.on(
            "error",
            function(error) {

                console.error(
                    error
                );


                log(
                    "PEER ERROR: " +
                    error.type
                );


                /*
                 * peer-unavailable bukan
                 * berarti kamera rusak.
                 *
                 * Artinya monitor belum
                 * tersedia.
                 */

                if (
                    error.type ===
                    "peer-unavailable"
                ) {

                    setStatus(
                        "WAITING FOR MONITOR",
                        "warning"
                    );


                    scheduleRetry();

                    return;
                }


                setStatus(
                    "PEER ERROR",
                    "error"
                );
            }
        );


        /*
         * Peer disconnected
         */

        peer.on(
            "disconnected",
            function() {

                log(
                    "PeerJS disconnected."
                );


                setStatus(
                    "SIGNALING OFFLINE",
                    "error"
                );
            }
        );
    }


    /*
     * =====================================================
     * CONNECT MONITOR
     * =====================================================
     */

    function connectToMonitor() {

        if (!peer) {
            return;
        }


        if (!cameraStream) {
            return;
        }


        if (currentCall) {
            return;
        }


        log(
            "Mencoba menghubungi " +
            MONITOR_ID +
            "..."
        );


        try {

            currentCall =
                peer.call(
                    MONITOR_ID,
                    cameraStream
                );


            if (!currentCall) {

                log(
                    "Call gagal dibuat."
                );


                currentCall =
                    null;


                scheduleRetry();

                return;
            }


            setStatus(
                "CONNECTING MONITOR",
                "warning"
            );


            currentCall.on(
                "close",
                function() {

                    log(
                        "Monitor menutup koneksi."
                    );


                    currentCall =
                        null;


                    setStatus(
                        "WAITING FOR MONITOR",
                        "warning"
                    );


                    scheduleRetry();
                }
            );


            currentCall.on(
                "error",
                function(error) {

                    log(
                        "CALL ERROR: " +
                        error.message
                    );


                    currentCall =
                        null;


                    scheduleRetry();
                }
            );


        } catch (error) {

            log(
                "CALL EXCEPTION: " +
                error.message
            );


            currentCall =
                null;


            scheduleRetry();
        }
    }


    /*
     * =====================================================
     * RETRY
     * =====================================================
     */

    function scheduleRetry() {

        if (retryTimer) {
            return;
        }


        log(
            "Akan mencoba lagi dalam 3 detik..."
        );


        retryTimer =
            setTimeout(
                function() {

                    retryTimer =
                        null;


                    connectToMonitor();

                },
                3000
            );
    }


    /*
     * =====================================================
     * STOP
     * =====================================================
     */

    function stopCamera() {

        log(
            "Menghentikan kamera..."
        );


        if (currentCall) {

            currentCall.close();

            currentCall =
                null;
        }


        if (cameraStream) {

            cameraStream
                .getTracks()
                .forEach(
                    function(track) {

                        track.stop();

                    }
                );

            cameraStream =
                null;
        }


        if (peer) {

            peer.destroy();

            peer =
                null;
        }


        video.srcObject =
            null;


        setStatus(
            "STOPPED",
            "error"
        );


        log(
            "Kamera dihentikan."
        );
    }

</script>

</body>

</html>
