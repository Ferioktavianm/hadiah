<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hadiah CCTV</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #0d1117;
            color: white;

            font-family: Arial, sans-serif;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .card {
            background: #161b22;

            border: 1px solid #30363d;

            border-radius: 20px;

            padding: 30px;

            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #8b949e;

            margin-bottom: 25px;
        }

        a {
            display: block;

            text-decoration: none;

            color: white;

            background: #238636;

            padding: 15px;

            margin-top: 12px;

            border-radius: 10px;

            font-weight: bold;
        }

        a.monitor {
            background: #1f6feb;
        }

        a:active {
            transform: scale(.98);
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>
            🎁 Hadiah CCTV
        </h1>

        <p>
            Pilih tampilan
        </p>

        <a href="camera.html">
            📷 CAMERA
        </a>

        <a
            href="monitor.html"
            class="monitor"
        >
            👁️ MONITOR
        </a>

    </div>

</div>

</body>
</html>
