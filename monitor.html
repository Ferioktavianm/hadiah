<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCTV Monitor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; background: #0d1117; color: white; font-family: Arial, sans-serif; padding: 20px; }
        .container { width: 100%; max-width: 900px; margin: auto; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 18px; padding: 24px; }
        h1 { margin-bottom: 8px; }
        .subtitle { color: #8b949e; margin-bottom: 20px; }
        video { width: 100%; aspect-ratio: 16 / 9; object-fit: contain; display: block; background: black; border-radius: 14px; margin-top: 20px; }
        .info { margin-top: 16px; padding: 15px; background: #0d1117; border-radius: 10px; color: #8b949e; line-height: 1.8; }
        .online { color: #3fb950; }
        .warning { color: #d29922; }
        .error { color: #f85149; }
        button { width: 100%; margin-top: 16px; padding: 14px; border: none; border-radius: 10px; background: #da3633; color: white; font-size: 16px; font-weight: bold; }
        button:active { transform: scale(.98); }
        .log { margin-top: 16px; padding: 12px; background: #010409; border-radius: 10px; color: #8b949e; font-family: monospace; font-size: 12px; white-space: pre-wrap; max-height: 220px; overflow-y: auto; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>👁️ CCTV MONITOR</h1>
        <p class="subtitle">Live monitoring</p>
        <video id="remoteVideo" autoplay playsinline controls></video>
        <div class="info">
            Camera ID: <strong>CAMERA-01</strong><br>
            Monitor ID: <strong>MONITOR-01</strong><br>
            Status: <strong id="status" class="warning">STARTING...</strong>
        </div>
        <button onclick="disconnect()">DISCONNECT</button>
        <div id="log" class="log"></div>
    </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
    const MONITOR_ID = "MONITOR-01";
    const CAMERA_ID = "CAMERA-01";

    let peer = null;
    let currentCall = null;

    const video = document.getElementById("remoteVideo");
    const status = document.getElementById("status");
    const logElement = document.getElementById("log");

    function log(message) {
        console.log("[MONITOR]", message);
        const time = new Date().toLocaleTimeString();
        logElement.textContent += `[${time}] ${message}\n`;
        logElement.scrollTop = logElement.scrollHeight;
    }

    function setStatus(text, type) {
        status.textContent = text;
        status.className = type;
    }

    window.addEventListener("load", startMonitor);

    function startMonitor() {
        log("Memulai monitor...");
        log("Monitor ID: " + MONITOR_ID);
        setStatus("CONNECTING", "warning");

        peer = new Peer(MONITOR_ID);

        peer.on("open", function(id) {
            log("Peer berhasil online.");
            log("ID: " + id);
            setStatus("WAITING FOR CAMERA", "warning");
        });

        peer.on("call", function(call) {
            log("Incoming call dari: " + call.peer);

            if (call.peer !== CAMERA_ID) {
                log("Call ditolak. Camera ID salah.");
                call.close();
                return;
            }

            call.answer();
            currentCall = call;
            setStatus("CONNECTING VIDEO", "warning");
            log("Call diterima.");

            call.on("stream", async function(remoteStream) {
                log("Video stream diterima!");
                video.srcObject = remoteStream;
                try {
                    await video.play();
                    log("Video berhasil diputar.");
                } catch (error) {
                    log("Autoplay diblokir. Tekan tombol play.");
                }
                setStatus("LIVE", "online");
            });

            call.on("close", function() {
                log("Kamera disconnect.");
                currentCall = null;
                video.srcObject = null;
                setStatus("CAMERA OFFLINE", "error");
            });

            call.on("error", function(error) {
                console.error(error);
                log("CALL ERROR: " + error.message);
                currentCall = null;
                video.srcObject = null;
                setStatus("CALL ERROR", "error");
            });
        });

        peer.on("error", function(error) {
            console.error(error);
            log("PEER ERROR: " + error.type);

            if (error.type === "unavailable-id") {
                setStatus("MONITOR ID ALREADY USED", "error");
                return;
            }
            if (error.type === "network") {
                setStatus("NETWORK ERROR", "error");
                return;
            }
            setStatus(error.type, "error");
        });

        peer.on("disconnected", function() {
            log("PeerJS disconnected.");
            setStatus("SIGNALING OFFLINE", "error");
        });

        peer.on("close", function() {
            log("Monitor Peer ditutup.");
            setStatus("OFFLINE", "error");
        });
    }

    function disconnect() {
        log("Disconnect...");
        if (currentCall) { currentCall.close(); currentCall = null; }
        if (peer) { peer.destroy(); peer = null; }
        video.srcObject = null;
        setStatus("DISCONNECTED", "error");
    }
</script>
</body>
</html>
